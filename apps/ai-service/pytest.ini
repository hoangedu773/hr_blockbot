[pytest]
# `tests/` is the hermetic unit suite. The `qa_*.py` modules next to `app/` are
# standalone audit scripts with their own `__main__` runners (`python qa_*.py`);
# collecting them here ran them with workstation credentials and without
# `tests/conftest.py`, so their env neutralisation and network guard never applied.
testpaths = tests
markers =
    v1: runtime mounted by `app.authorization_gateway:app` (production boundary)
    legacy: legacy `app.main` / agent loop / RAG corpus, kept for offline regression only
    eval: benchmarks needing a model, dataset or live provider
# Default lane is the V1 boundary. Run the legacy corpus deliberately:
#   pytest -q -m legacy
addopts = -m "not legacy and not eval"
